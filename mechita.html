ze:13px; line-height:1.5;\">Especialista en logística, transporte, rutas y operación.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(120,170,230,.05); border:1px solid rgba(120,170,230,.16); border-radius:16px; padding:20px 16px;\">\n        <div style=\"font-size:24px; margin-bottom:10px;\">📊<\u002Fdiv>\n        <h3 style=\"font-family:'Saira Condensed',sans-serif; font-weight:600; font-size:18px; text-transform:uppercase; margin:0 0 6px;\">SICETAC<\u002Fh3>\n        <p style=\"margin:0; color:#8fa4c4; font-size:13px; line-height:1.5;\">Valores de referencia y costos de fletes por ruta.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(120,170,230,.05); border:1px solid rgba(120,170,230,.16); border-radius:16px; padding:20px 16px;\">\n        <div style=\"font-size:24px; margin-bottom:10px;\">📈<\u002Fdiv>\n        <h3 style=\"font-family:'Saira Condensed',sans-serif; font-weight:600; font-size:18px; text-transform:uppercase; margin:0 0 6px;\">Estadísticas<\u002Fh3>\n        <p style=\"margin:0; color:#8fa4c4; font-size:13px; line-height:1.5;\">Cifras y tendencias del sector para leer el partido.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:rgba(120,170,230,.05); border:1px solid rgba(120,170,230,.16); border-radius:16px; padding:20px 16px;\">\n        <div style=\"font-size:24px; margin-bottom:10px;\">🌐<\u002Fdiv>\n        <h3 style=\"font-family:'Saira Condensed',sans-serif; font-weight:600; font-size:18px; text-transform:uppercase; margin:0 0 6px;\">Web en vivo<\u002Fh3>\n        <p style=\"margin:0; color:#8fa4c4; font-size:13px; line-height:1.5;\">Acceso a internet para traer información actual y verificada.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PREGUNTAS -->\n  <section id=\"preguntas\" style=\"position:relative; max-width:1200px; margin:0 auto; padding:80px 26px 40px;\">\n    <div data-reveal=\"\" style=\"max-width:760px; margin-bottom:38px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:1.4px; text-transform:uppercase; color:#a9d626; margin-bottom:14px;\">Calienta y prueba<\u002Fdiv>\n      <h2 style=\"font-family:'Saira Condensed',sans-serif; font-weight:700; font-size:clamp(30px,4vw,52px); line-height:1.02; letter-spacing:-1px; text-transform:uppercase; margin:0;\">¿Qué le puedes preguntar?<\u002Fh2>\n      <p style=\"margin:16px 0 0; font-size:17.5px; line-height:1.6; color:#b9c8e2;\">Estas son algunas de las jugadas que Mechita resuelve en la conversación 😉<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-wrap:wrap; gap:13px;\">\n      <sc-for list=\"{{ prompts }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div data-reveal=\"\" style=\"display:inline-flex; align-items:center; gap:11px; background:rgba(120,170,230,.06); border:1px solid rgba(120,170,230,.2); border-radius:14px; padding:15px 19px; color:#e9f1ff; font-size:15px;\">\n          <span style=\"font-size:20px;\">{{ p.emoji }}<\u002Fspan> <span>{{ p.q }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA PITAZO -->\n  <section style=\"position:relative; max-width:1200px; margin:40px auto 0; padding:0 26px 90px;\">\n    <div data-reveal=\"\" style=\"position:relative; overflow:hidden; border-radius:26px; background:linear-gradient(150deg,#0a2452,#061125); border:1px solid rgba(87,201,255,.28); padding:64px 48px; text-align:center;\">\n      <div style=\"position:absolute; top:0; left:-40%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(87,201,255,.14),transparent); transform:skewX(-18deg); animation:sweep 5s ease-in-out infinite;\"><\u002Fdiv>\n      <div style=\"position:relative;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#57c9ff; margin-bottom:16px;\">El pitazo inicial está cada vez más cerca<\u002Fdiv>\n        <div style=\"font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:clamp(46px,7vw,84px); letter-spacing:2px; line-height:1; background:linear-gradient(90deg,#57c9ff,#a9d626); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;\">{{ launchDate }}<\u002Fdiv>\n        <p style=\"max-width:560px; margin:22px auto 0; font-size:18px; line-height:1.6; color:#b9c8e2;\">Mechita es el nuevo integrante del equipo CCL: una agente de IA que llega para ayudar a tomar mejores decisiones en logística, transporte y datos.<\u002Fp>\n        <div style=\"display:flex; justify-content:center; gap:12px; margin-top:26px; flex-wrap:wrap;\">\n          <span style=\"display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#8fa4c4; border:1px solid rgba(120,170,230,.22); border-radius:100px; padding:9px 15px;\">⚙️ Powered by OpenClaw<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#8fa4c4; border:1px solid rgba(120,170,230,.22); border-radius:100px; padding:9px 15px;\">🟢 Vive en WhatsApp<\u002Fspan>\n          <span style=\"display:inline-flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:#8fa4c4; border:1px solid rgba(120,170,230,.22); border-radius:100px; padding:9px 15px;\">🧠 Consulta a su equipo<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"position:relative; border-top:1px solid rgba(120,170,230,.14); background:rgba(4,11,24,.6);\">\n    <div style=\"max-width:1200px; margin:0 auto; padding:40px 26px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;\">\n      <div style=\"display:flex; align-items:center; gap:15px;\">\n        <span style=\"display:inline-flex; align-items:center; background:#05  Justo lo que hago ahora mismo ⚽' },\n      { who:'u', text:'Jajaja crack. ¿Cómo va el sector transporte este mes? 📈' },\n      { who:'m', consult:{ name:'Bruno Logístico', emoji:'🚚' }, text:'Le pedí las cifras a Bruno Logístico 🚚 Movilización estable, con presión en costos de combustible. ¿Quieres el detalle por corredor?' },\n      { who:'u', text:'Y las vías hoy, ¿algo raro? 🌐' },\n      { who:'m', consult:{ name:'Web en vivo', emoji:'🌐' }, text:'Reviso en la web ahora mismo 🌐 Hay un cierre parcial en la vía al Llano. Te paso el reporte apenas se confirme 🙌' },\n      { who:'u', text:'Eres una dura 😄' },\n      { who:'m', text:'Para eso me ficharon 😎⚽' },\n    ];\n  }\n\n  componentDidMount(){ this._timers = []; this.play(0); }\n  componentWillUnmount(){ (this._timers||[]).forEach(clearTimeout); }\n  componentDidUpdate(){ if(this._scrollEl){ this._scrollEl.scrollTop = this._scrollEl.scrollHeight; } }\n\n  play(i){\n    const tl = this.timeline();\n    if(i >= tl.length){\n      const t = setTimeout(()=>{ this.setState({ shown:[], pending:null }); const t2=setTimeout(()=>this.play(0), 500); this._timers.push(t2); }, 3600);\n      this._timers.push(t); return;\n    }\n    const item = tl[i];\n    if(item.who === 'u'){\n      this.setState(s=>({ shown:[...s.shown, item] }));\n      const t = setTimeout(()=>this.play(i+1), 900); this._timers.push(t);\n    } else {\n      this.setState({ pending:{ consult:item.consult } });\n      const wait = item.consult ? 1700 : 1000;\n      const t = setTimeout(()=>{\n        this.setState(s=>({ shown:[...s.shown, item], pending:null }));\n        const t2 = setTimeout(()=>this.play(i+1), 700); this._timers.push(t2);\n      }, wait);\n      this._timers.push(t);\n    }\n  }\n\n  bubble(item, key){\n    const R = React.createElement;\n    const isM = item.who === 'm';\n    const row = { display:'flex', justifyContent: isM ? 'flex-start' : 'flex-end' };\n    const bub = {\n      maxWidth:'80%', padding:'9px 12px', borderRadius: isM ? '4px 13px 13px 13px' : '13px 4px 13px 13px',\n      background: isM ? '#202c33' : '#005c4b', color:'#e9edef', fontSize:'13.5px', lineHeight:'1.45',\n      fontFamily:\"'Saira',sans-serif\", boxShadow:'0 1px 1px rgba(0,0,0,.25)', wordBreak:'break-word'\n    };\n    const kids = [];\n    if(isM && item.consult){\n      kids.push(R('div',{ key:'tag', style:{ display:'inline-flex', alignItems:'center', gap:'5px', fontSize:'10.5px', fontFamily:\"'IBM Plex Mono',monospace\", color:'#8fd0ff', background:'rgba(87,201,255,.12)', border:'1px solid rgba(87,201,255,.25)', borderRadius:'6px', padding:'2px 7px', marginBottom:'6px' } }, 'vía ' + item.consult.name + ' ' + item.consult.emoji));\n    }\n    kids.push(R('div',{ key:'txt' }, item.text));\n    return R('div',{ key, style:row }, R('div',{ style:bub }, kids));\n  }\n\n  renderVals(){\n    const R = React.createElement;\n    const nodes = this.state.shown.map((it,idx)=>this.bubble(it, 'b'+idx));\n    if(this.state.pending){\n      const c = this.state.pending.consult;\n      const dot = (d)=>R('span',{ key:d, style:{ width:'6px', height:'6px', borderRadius:'50%', background:'#8696a0', display:'inline-block', animation:'blink 1.2s infinite '+d+'s' } });\n      let inner;\n      if(c){\n        inner = R('div',{ style:{ display:'flex', alignItems:'center', gap:'8px' } },\n          R('span',{ style:{ width:'13px', height:'13px', borderRadius:'50%', border:'2px solid rgba(87,201,255,.3)', borderTopColor:'#57c9ff', display:'inline-block', animation:'spin .8s linear infinite' } }),\n          R('span',{ style:{ fontSize:'12.5px', color:'#b9c8e2', fontFamily:\"'Saira',sans-serif\" } }, 'consultando a '+c.name+' '+c.emoji)\n        );\n      } else {\n        inner = R('div',{ style:{ display:'flex', gap:'4px', alignItems:'center' } }, dot(0), dot(.2), dot(.4));\n      }\n      nodes.push(R('div',{ key:'pending', style:{ display:'flex', justifyContent:'flex-start' } },\n        R('div',{ style:{ background:'#202c33', borderRadius:'4px 13px 13px 13px', padding:'10px 13px', boxShadow:'0 1px 1px rgba(0,0,0,.25)' } }, inner)\n      ));\n    }\n    const prompts = [\n      { emoji:'📊', q:'¿Cuánto vale un flete Bogotá–Cali?' },\n      { emoji:'🎓', q:'¿Qué es un agente de IA?' },\n      { emoji:'📈', q:'¿Cómo va el sector transporte este mes?' },\n      { emoji:'🌐', q:'¿Hay novedades en las vías hoy?' },\n      { emoji:'🚚', q:'Explícame SICETAC en simple' },\n      { emoji:'⚽', q:'¿Qué puedes hacer por mi operación?' },\n    ];\n    return {\n      chatBody: R('div',{ style:{ display:'flex', flexDirection:'column', gap:'9px' } }, nodes),\n      setScrollRef: (el)=>{ this._scrollEl = el; },\n      launchDate: this.props.launchDate || '8 · 7 · 2026',\n      prompts,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
