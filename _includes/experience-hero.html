{% assign ec = site.data.experiences[include.lang] %}
<section class="home-hero experience-hero">
  <div class="container hero-grid">
    <div class="hero-copy">
      <p class="eyebrow">{{ ec.eyebrow }}</p>
      <h1>{{ ec.hero_title }} <em>{{ ec.hero_emphasis }}</em></h1>
      <p class="hero-positioning">{{ ec.hero_lead }}</p>
      <p class="experience-hero-summary">{{ ec.intro }}</p>
      <div class="hero-actions">
        {% include bruno-link.html lang=include.lang %}
        <a class="btn btn-outline" href="#experiencias">{{ ec.choose }}</a>
      </div>
      <a class="experience-portal-link experience-transport-link" href="{{ ec.prefix }}/inteligencia-planeacion-transporte/">{{ ec.transport_link }} →</a>
    </div>
    <figure class="experience-photo">
      <img src="{{ ec.photo }}" alt="{{ ec.photo_alt }}" width="1600" height="900" fetchpriority="high"/>
      <figcaption><strong>Juan Pablo Matiz · ATIEMPPO</strong><span>{{ ec.photo_caption }}</span><a href="{{ ec.photo_path | default: '/blog/colfecar-en-tu-region-cali/' }}">{{ ec.photo_link }} →</a></figcaption>
    </figure>
  </div>
</section>
