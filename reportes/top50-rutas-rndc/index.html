      const q = document.getElementById('q').value.trim().toLowerCase();

      const rows = filtered();

      const r = ROUTES.find(x=>x.route===route);

        const layer = L.geoJSON({type:'Feature', properties:r, geometry:r.geometry});
        map.fitBounds(layer.getBounds(), {padding:[30,30], maxZoom:9});

      if (rerender) render();
