  publication:
    title: "El Dato Logístico"
    text: "A publication for following the questions and changes in transport. The reports and the current situation are read there. It is published in Spanish."
    url: "https://www.eldatologistico.com"
    action: "Read it and subscribe"
  faqs:
    - question: "What is SICETAC?"
      answer: "SICETAC is the Efficient Cost System for Automotive Freight Transport of the Ministry of Transport. It publishes reference values for road freight rates in Colombia."
    - question: "How do I look up SICETAC?"
      answer: "At ATIEMPPO you can review the options in SICETAC al Instante, on the web, or write on the lookup WhatsApp channel. The API, the full database and the reports on this page are there as well."
    - question: "Is ATIEMPPO the official SICETAC?"
      answer: "No. ATIEMPPO is independent of the Ministry of Transport. This service is not the official SICETAC application or a certification from that body. A result is not a transport offer, a vehicle booking or a contract with a carrier."
    - question: "What is the difference between a published reference and a model calculation?"
      answer: "A published reference uses the published inputs for the requested period and the applicable logistics hours. A model calculation runs the model with the available parameters and can give a different total. The model breakdown is not presented as the breakdown of a published figure, and it is not added to that figure."
    - question: "Where do I see how SICETAC changes?"
      answer: "In the living reports on this page, including the ACPM follow-up, the change between periods, the hours and the route profile. El Dato Logístico publishes the reading of those changes."
