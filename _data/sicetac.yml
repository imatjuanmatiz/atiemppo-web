faqs:
  - question: "¿Qué es SICETAC?"
    answer: "SICETAC es el Sistema de Costos Eficientes para el Transporte Automotor de Carga del Ministerio de Transporte. Publica valores de referencia de fletes de carga terrestre en Colombia."
  - question: "¿Cómo consultar SICETAC?"
    answer: "En ATIEMPPO puedes revisar las opciones en SICETAC al Instante, en la web, o escribir por WhatsApp al canal de consulta. También están la API, la base completa y los reportes de esta página."
  - question: "¿ATIEMPPO es el SICETAC oficial?"
    answer: "No. ATIEMPPO es independiente del Ministerio de Transporte. Este servicio no es la aplicación oficial SICETAC ni una certificación de esa entidad. Un resultado no es una oferta de transporte, una reserva de vehículo ni un contrato con un transportador."
  - question: "¿Qué diferencia hay entre una referencia publicada y un cálculo del modelo?"
    answer: "Una referencia publicada usa los insumos publicados del período solicitado y las horas logísticas aplicables. Un cálculo del modelo ejecuta el modelo con los parámetros disponibles y puede dar un total distinto. El desglose del modelo no se presenta como el desglose de una cifra publicada ni se suma a esa cifra."
  - question: "¿Dónde veo cómo cambia el SICETAC?"
    answer: "En los reportes vivos de esta página, entre ellos el seguimiento del ACPM, la variación entre períodos, las horas y el perfil de rutas. El Dato Logístico publica la lectura de esos cambios."
