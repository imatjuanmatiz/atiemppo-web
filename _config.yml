# ═══════════════════════════════════════
# ATIEMPPO — Jekyll Configuration
# ═══════════════════════════════════════
title: "ATIEMPPO — Negocio, datos e IA para recuperar tiempo"
description: "ATIEMPPO habla el idioma del negocio y el de la tecnología para ayudar a empresas a entender sus problemas, interactuar mejor con sus datos y recuperar tiempo operativo."
url: "https://atiemppo.com"
baseurl: ""
lang: "es-CO"
timezone: "America/Bogota"

# Author
author:
  name: "Juan Pablo Matiz"
  email: "juanmatiz@atiemppo.co"
  twitter: "@atiemppo"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# AEO
llms_txt: /llms.txt

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - reportes/README.md
  - node_modules
  - vendor
