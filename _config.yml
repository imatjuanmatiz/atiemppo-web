# ═══════════════════════════════════════
# ATIEMPPO — Jekyll Configuration
# ═══════════════════════════════════════
title: "ATIEMPPO — Inteligencia de transporte, acompañamiento en IA y consultoría"
description: "ATIEMPPO integra experiencia sectorial, investigación, datos, herramientas y agentes en tres líneas: inteligencia y planeación de transporte, acompañamiento en IA para empresas y consultoría especializada."
url: "https://atiemppo.com"
baseurl: ""
lang: "es-CO"
timezone: "America/Bogota"

# Author
author:
  name: "Juan Pablo Matiz"
  email: "juanmatiz@atiemppo.co"
  twitter: "@atiemppo"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# AEO
llms_txt: /llms.txt
llms_full: /llms-full.txt

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - reportes/README.md
  - INDEX-DEFINITIVO-REVISION.md
  - GOOGLE_SHEETS_SETUP.md
  - GEO-CRAWLER-NOTES.md
  - node_modules
  - vendor
