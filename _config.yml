# ═══════════════════════════════════════
# ATIEMPPO — Jekyll Configuration
# ═══════════════════════════════════════
title: "ATIEMPPO · Taller de conocimiento"
description: "Creamos soluciones y compartimos lo que aprendemos. Explora contenido propio, usa nuestras herramientas o aprende y trabaja con ATIEMPPO sobre un reto concreto."
url: "https://atiemppo.com"
baseurl: ""
lang: "es-CO"
timezone: "America/Bogota"

# Author
author:
  name: "Juan Pablo Matiz"
  email: "juanmatiz@atiemppo.co"
  twitter: "@atiemppo"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# AEO
llms_txt: /llms.txt
llms_full: /llms-full.txt

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - reportes/README.md
  - INDEX-DEFINITIVO-REVISION.md
  - GOOGLE_SHEETS_SETUP.md
  - GEO-CRAWLER-NOTES.md
  - node_modules
  - vendor

  - docs
  - designs
  - AGENTS.md
  - output
  - design-qa.md
  - google-apps-script
  - scripts
  - tests
