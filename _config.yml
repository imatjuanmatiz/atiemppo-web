# ═══════════════════════════════════════
# ATIEMPPO — Jekyll Configuration
# ═══════════════════════════════════════
title: "IA y datos para decidir mejor | ATIEMPPO"
description: "Ayudamos a líderes y equipos a aplicar IA y datos a decisiones reales. Experiencia propia en transporte y logística; el método sirve a otras áreas."
url: "https://atiemppo.com"
baseurl: ""
lang: "es-CO"
timezone: "America/Bogota"

# Author
author:
  name: "Juan Pablo Matiz"
  email: "juanmatiz@atiemppo.co"
  twitter: "@atiemppo"

# Build
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# AEO
llms_txt: /llms.txt
llms_full: /llms-full.txt

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - reportes/README.md
  - INDEX-DEFINITIVO-REVISION.md
  - GOOGLE_SHEETS_SETUP.md
  - GEO-CRAWLER-NOTES.md
  - node_modules
  - vendor

  - docs
  - designs
  - AGENTS.md
  - output
  - design-qa.md
  - google-apps-script
  - scripts
  - tests
