<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1016" viewBox="0 0 800 1016" role="img" aria-labelledby="capacitacion-ia-recorrido-es-title capacitacion-ia-recorrido-es-desc"><title id="capacitacion-ia-recorrido-es-title">De aprender a seguir creando</title><desc id="capacitacion-ia-recorrido-es-desc">El equipo elige un reto, practica con IA, construye y prueba agentes, documenta el trabajo y continúa con nuevos proyectos acompañado por ATIEMPPO.</desc><defs><marker id="capacitacion-ia-recorrido-es-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#466079"/></marker></defs><rect width="800" height="1016" fill="#F4F3EF"/><text x="48" y="56" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="700" fill="#2E78BC">ATIEMPPO</text><text x="48" y="120" font-family="'DM Serif Display',Georgia,serif" font-size="40" font-weight="400" fill="#102C53">Tu equipo aprende.</text><text x="48" y="168" font-family="'DM Serif Display',Georgia,serif" font-size="40" font-weight="400" fill="#102C53">La capacidad se queda.</text><line x1="88" y1="328" x2="88" y2="352" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-recorrido-es-arrow)"/><line x1="88" y1="460" x2="88" y2="484" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-recorrido-es-arrow)"/><line x1="88" y1="592" x2="88" y2="616" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-recorrido-es-arrow)"/><line x1="88" y1="724" x2="88" y2="748" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-recorrido-es-arrow)"/><rect x="48" y="224" width="704" height="104" rx="8" fill="#FFFFFF" stroke="#BCCAD4"/><text x="72" y="264" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="700" fill="#466079">01</text><text x="128" y="264" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">Elegir un reto</text><text x="128" y="304" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="400" fill="#466079">Objetivo, fuentes y responsable</text><rect x="48" y="356" width="704" height="104" rx="8" fill="#FFFFFF" stroke="#BCCAD4"/><text x="72" y="396" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="700" fill="#466079">02</text><text x="128" y="396" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">Practicar con IA</text><text x="128" y="436" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="400" fill="#466079">Criterio para revisar resultados</text><rect x="48" y="488" width="704" height="104" rx="8" fill="#FFFFFF" stroke="#BCCAD4"/><text x="72" y="528" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="700" fill="#466079">03</text><text x="128" y="528" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">Construir y probar</text><text x="128" y="568" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="400" fill="#466079">Agentes creados por el equipo</text><rect x="48" y="620" width="704" height="104" rx="8" fill="#FFFFFF" stroke="#BCCAD4"/><text x="72" y="660" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="700" fill="#466079">04</text><text x="128" y="660" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">Documentar y transferir</text><text x="128" y="700" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="400" fill="#466079">Guías, pruebas y mantenimiento</text><rect x="48" y="752" width="704" height="104" rx="8" fill="#E5EFF7" stroke="#2E78BC"/><text x="72" y="792" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="700" fill="#466079">05</text><text x="128" y="792" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">Continuar con nuevos proyectos</text><text x="128" y="832" font-family="'Instrument Sans',Arial,sans-serif" font-size="28" font-weight="400" fill="#466079">Reutilizar y mejorar con apoyo</text><text x="48" y="936" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="400" fill="#466079">ATIEMPPO acompaña cada paso acordado.</text><text x="48" y="976" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#2E78BC">atiemppo.com</text></svg>
