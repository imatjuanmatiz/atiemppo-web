<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="capacitacion-ia-ficha-es-title capacitacion-ia-ficha-es-desc"><title id="capacitacion-ia-ficha-es-title">De aprender a seguir creando</title><desc id="capacitacion-ia-ficha-es-desc">El equipo elige un reto, practica con IA, construye y prueba agentes, documenta el trabajo y continúa con nuevos proyectos acompañado por ATIEMPPO.</desc><defs><marker id="capacitacion-ia-ficha-es-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#466079"/></marker></defs><rect width="1200" height="760" fill="#F4F3EF"/><text x="64" y="72" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#2E78BC">ATIEMPPO</text><text x="64" y="192" font-family="'DM Serif Display',Georgia,serif" font-size="64" font-weight="400" fill="#102C53">Capacita a tu equipo.</text><text x="64" y="272" font-family="'DM Serif Display',Georgia,serif" font-size="64" font-weight="400" fill="#102C53">Construyan sus</text><text x="64" y="352" font-family="'DM Serif Display',Georgia,serif" font-size="64" font-weight="400" fill="#102C53">propios agentes.</text><text x="64" y="476" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="400" fill="#466079">Práctica · pruebas · documentación</text><text x="64" y="524" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="400" fill="#466079">Acompañamiento a nuevos proyectos</text><text x="872" y="152" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#466079">01</text><text x="872" y="200" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">APRENDER</text><line x1="888" y1="212" x2="888" y2="244" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-ficha-es-arrow)"/><text x="872" y="272" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#466079">02</text><text x="872" y="320" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">CONSTRUIR</text><line x1="888" y1="332" x2="888" y2="364" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-ficha-es-arrow)"/><text x="872" y="392" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#466079">03</text><text x="872" y="440" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">DOCUMENTAR</text><line x1="888" y1="452" x2="888" y2="484" stroke="#466079" stroke-width="2" marker-end="url(#capacitacion-ia-ficha-es-arrow)"/><text x="872" y="512" font-family="'Instrument Sans',Arial,sans-serif" font-size="24" font-weight="600" fill="#466079">04</text><text x="872" y="560" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="700" fill="#102C53">CONTINUAR</text><line x1="64" y1="636" x2="1136" y2="636" stroke="#BCCAD4"/><text x="64" y="696" font-family="'Instrument Sans',Arial,sans-serif" font-size="32" font-weight="400" fill="#466079">ATIEMPPO acompaña cada paso acordado.</text></svg>
